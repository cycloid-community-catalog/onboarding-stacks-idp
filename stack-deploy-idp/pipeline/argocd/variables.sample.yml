#
# Application Image Tag
#

#. app_image_tag (required):  ""
#+ The tag to use for the container image. Example: "pr1" for a pull request environment or "1.0.0" for a release environment.
app_image_tag: ""


#
# Registry
#

#. registry_repository (required): ''
#+ The repository path to use for the container images.
registry_repository: "olivier2t/app-test-env"

#. registry_username (required): ''
#+ The username to access the registry.
registry_username: "((dockerhub.username))"

#. registry_password (required): ''
#+ The password to access the registry.
registry_password: "((dockerhub.password))"


#
# Application
#

#. app_git_url (required): ''
#+ Public git URL where the application is stored.
# app_git_url: "git@github.com:cycloid-demo/($ .org $)-($ .project $)-app.git"

#. app_git_branch (required): "main"
#+ Git branch where the application is stored.
# app_git_branch: "main"

#. app_git_ssh_key (required): ''
#+ The SSH private key to access the git repository.
# app_git_ssh_key: "((($ .project $)-($ .env $)-app-git-ssh.ssh_key))"

#
# Manifests
#

#. manifests_git_url (required): ''
#+ Git repository URL where the manifests are stored.
manifests_git_url: "git@github.com:cycloid-demo/($ .org $)-manifests.git"

#. manifests_git_branch (required): ''
#+ Git branch where the manifests are stored.
manifests_git_branch: "main"

#. manifests_git_ssh_key (required): ''
#+ The SSH private key to access the git repository.
manifests_git_ssh_key: "((($ .org $)-manifests-git-ssh.ssh_key))"

#
# Application
#

#. app_replicas (required): 3
#+ The number of replicas to deploy in the Kubernetes Cluster.
app_replicas: 3

#
# Kubernetes
#

#. kubeconfig_content (required): ''
#+ Kubeconfig content from Cycloid vault.
kubeconfig_content: "((kubeconfig.kubeconfig))"

#
# DNS Zone
#

#. dns_zone (required): 'demo.cycloid.io'
#+ DNS zone to use for the application.
dns_zone: "demo.cycloid.io"

#
# Default variables
#

#. cy_api_key (required): ((admin-api-key.key))
#+ API key to grant admin acess to Cycloid API.
cy_api_key: ((admin-api-key.key))

#. terraform_version (required): '1.8.3'
#+ terraform version used to execute your code.
terraform_version: '1.8.3'

#
# Plugins
#
# List registries:  cy plugin registry list --org <org>
# List plugins:     cy plugin registry plugin list <registry>
# List versions:    cy plugin registry plugin version list --registry <registry> --plugin <name>

#. register_plugins (optional): true
#+ Install or upgrade the ArgoCD Cycloid plugin and enable it on this component after manifests are pushed.
register_plugins: true

#. plugin_registry (optional): ""
#+ Plugin registry canonical or numeric ID. When empty and the org has exactly one registry, that registry is used.
plugin_registry: ""

#. plugin_argocd_name (optional): ArgoCD
#+ ArgoCD plugin name in the registry (from cy plugin registry plugin list). Aliases tried: ArgoCD, cycloid-plugin-argocd, argocd, plugin-argocd.
plugin_argocd_name: ArgoCD

#. plugin_argocd_install_name (optional): argocd
#+ Installed plugin name for cy plugin get/upgrade/relation-set.
plugin_argocd_install_name: argocd

#. plugin_argocd_version_id (optional):
#+ Registry version ID to install. When empty, the latest published version is used.
plugin_argocd_version_id: ""

#. argocd_username (optional): admin
#+ Local ArgoCD account passed to the plugin install config.
argocd_username: admin

#. argocd_password (optional): cycloid
#+ ArgoCD password passed to the plugin install config.
argocd_password: cycloid