---
version: "2"
use_cases:
- name: default
  sections:
  - name: Kubernetes Single Node K3s
    groups:
    - name: ArgoCD
      technologies: [terraform]
      vars:
      - name: "ArgoCD Version"
        description: "Version of ArgoCD to deploy"
        key: argocd_version
        widget: simple_text
        type: string
        default: "v3.1.8"
        required: true
        validations: 
        - regexp: "^v\\d+\\.\\d+\\.\\d+$" 
          error_message: "Please enter a valid ArgoCD version such as v3.1.8"

    - name: Day-2 Operations
      technologies: [pipeline]
      vars:
      - name: "Instance status"
        description: "Status for the deployed instances."
        key: vm_instance_status
        widget: radios
        type: string
        default: "Started"
        values:
            - "Started"
            - "Stopped"
        required: true
      - name: "Destroy Timer"
        description: "The number of minutes to wait before automatically destroying the infrastructure after creation."
        key: destroy_timer_in_minutes
        widget: number
        type: integer
        default: 60
        required: true

    - name: Infrastructure Configuration
      technologies: [terraform]
      vars:
      # - name: "Instance type"
      #   description: "Instance type for the VM."
      #   key: vm_instance_type
      #   widget: dropdown
      #   type: string
      #   default: "t3a.medium"
      #   values_ref: https://cycloid-demo-stackforms-values.s3.eu-west-1.amazonaws.com/aws-ec2-instance-types.json
      #   required: true
      # - name: "Disk size"
      #   unit: Go
      #   description: "Disk size for the VM."
      #   key: vm_disk_size
      #   widget: slider_range
      #   type: integer
      #   default: 20
      #   values:
      #       - 20
      #       - 250
      #   required: true
      - name: "Hosted Zone"
        description: "Hosted Zone where DNS records will be created. This is the domain name where the ArgoCD server will be accessible."
        key: vm_aws_route53_zone
        widget: simple_text
        type: string
        default: "demo.cycloid.io"
        required: true

    - name: Environment
      technologies: [pipeline]
      vars:
      - name: "AWS Region"
        description: "AWS region from environment configuration."
        key: aws_region
        widget: hidden
        type: string
        default: "($ .env_vars.aws_region $)"